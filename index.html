<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio | Web Developer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <nav class="navbar container">
        <a href="index.html" class="logo"> MyPortfolio </a>

        <ul class="nav-links" id="nav-links">
          <li>
            <a href="index.html" class="active">Home</a>
          </li>

          <li>
            <a href="#">About</a>
          </li>

          <li>
            <a href="#">Projects</a>
          </li>

          <li>
            <a href="#">Contact</a>
          </li>
        </ul>

        <a href="#" class="nav-button"> Contact Me </a>

        <button
          class="menu-toggle"
          id="menu-toggle"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="nav-links"
        >
          ☰
        </button>
      </nav>
    </header>

    <main>
      <!-- Hero section -->
       <section class="hero">
        <div class="container hero-content">
          <div class="hero-text">

            <h2>Web Developer</h2>

            <p class="hero-description">
              I build responsive, modern and user-friendly websites using HTML,

            </p>

            <div class="hero-buttons">
              <a href="projects.html" class="btn btn-primary">
                View My Projects
              </a>

              <a href="contact.html" class="btn btn-secondary"> Contact Me </a>
            </div>
          </div>

          <div class="hero-image">
            <div class="image-container">
              <img src="image/myPic2.png" alt="Profile Image" />
            </div>
          </div>
        </div>
      </section>
